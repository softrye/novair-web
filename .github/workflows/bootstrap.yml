name: Bootstrap NOVAIR source

on:
  push:
    branches: [main]
    paths:
      - "NOVAIR_GH_BOOTSTRAP.zip"
      - ".github/workflows/bootstrap.yml"\n      - "bootstrap.trigger"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand NOVAIR source
        shell: bash
        run: |
          test -f NOVAIR_GH_BOOTSTRAP.zip
          unzip -o NOVAIR_GH_BOOTSTRAP.zip -d .
          rm -f NOVAIR_GH_BOOTSTRAP.zip

      - name: Commit extracted website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publicar NOVAIR V14 optimizado"
          git push
